<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="cue-grad-primary" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="cue-grad-accent" x1="20" y1="12" x2="44" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <filter id="cue-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Cyber C Arc -->
  <path 
    d="M 36 10 C 32 6 26 4 20 4 C 8.954 4 0 12.954 0 24 C 0 35.046 8.954 44 20 44 C 27 44 33 41.5 37 36" 
    transform="translate(4, 0)"
    stroke="url(#cue-grad-primary)" 
    stroke-width="5.5" 
    stroke-linecap="round" 
  />

  <!-- Inner Dynamic Synaptic Impulse (The Cue) -->
  <path 
    d="M 19 16 C 14.5 16 11 19.5 11 24 C 11 28.5 14.5 32 19 32 C 22.5 32 25.5 29.8 26.5 26.5" 
    transform="translate(4, 0)"
    stroke="url(#cue-grad-accent)" 
    stroke-width="4" 
    stroke-linecap="round" 
  />

  <!-- Neural Pulse Node -->
  <circle cx="34" cy="24" r="4.5" fill="#06B6D4" filter="url(#cue-glow)" />
  <circle cx="34" cy="24" r="2" fill="#FFFFFF" />
</svg>
