<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="cue-grad-primary" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="cue-grad-accent" x1="20" y1="12" x2="44" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
  </defs>

  <rect width="48" height="48" rx="12" fill="#0F172A" />

  <!-- Outer Cyber C Arc -->
  <path 
    d="M 33 11 C 29.5 7.5 24 6 18.5 6 C 9 6 2 13.5 2 24 C 2 34.5 9 42 18.5 42 C 25 42 30.5 39.5 34 34.5" 
    transform="translate(4, 0)"
    stroke="url(#cue-grad-primary)" 
    stroke-width="5" 
    stroke-linecap="round" 
  />

  <!-- Inner Dynamic Synaptic Impulse (The Cue) -->
  <path 
    d="M 18 16 C 14 16 11 19.5 11 24 C 11 28.5 14 32 18 32 C 21.5 32 24.5 29.5 25.5 26" 
    transform="translate(4, 0)"
    stroke="url(#cue-grad-accent)" 
    stroke-width="3.5" 
    stroke-linecap="round" 
  />

  <!-- Neural Pulse Node -->
  <circle cx="33" cy="24" r="4" fill="#06B6D4" />
  <circle cx="33" cy="24" r="1.8" fill="#FFFFFF" />
</svg>
