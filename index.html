<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    (function() {
      var base = document.createElement('base');
      base.href = window.location.pathname.startsWith('/clue-analytics') ? '/clue-analytics/' : '/';
      document.head.prepend(base);
    })();
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Clue Analytics provides expert AI and ML consulting to drive business results through strategy, development, and training." />
  <meta name="keywords" content="AI consulting, machine learning, AI strategy, ML development, AI training, Clue Analytics" />
  <meta name="author" content="Clue Analytics" />
  <meta property="og:title" content="Clue Analytics - AI & ML Consulting" />
  <meta property="og:description" content="Transform your business with our AI and ML expertise. From strategy to implementation, we deliver results." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://clueanalytics7.github.io/clue-analytics/" />
  <meta property="og:image" content="./assets/og-image.jpg" />
  <link rel="icon" type="image/png" href="./assets/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <title>Clue Analytics - AI & ML Consulting</title>

  <!-- SPA redirect decoder for clean URLs on static hosting -->
  <script type="text/javascript">
    (function(l) {
      if (l.search && l.search[1] === '/' ) {
        var decoded = l.search.slice(1).split('&').map(function(s) { 
          return s.replace(/~and~/g, '&');
        }).join('?');
        window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
        );
      }
    }(window.location));
  </script>
</head>
<body class="font-sans text-gray-800 dark:text-gray-200 bg-gray-50 dark:bg-gray-950">
  <div id="root"></div>

  <script type="module" src="./src/main.tsx"></script>
</body>
</html>
